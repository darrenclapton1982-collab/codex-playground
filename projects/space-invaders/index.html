<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders 3JS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="game-canvas" aria-label="Space Invaders playfield"></canvas>

    <header class="hud hud-top" role="presentation">
        <div class="hud-block">
            <span class="hud-label">Score</span>
            <strong id="score-value">0</strong>
        </div>
        <div class="hud-block">
            <span class="hud-label">High</span>
            <strong id="highscore-value">0</strong>
        </div>
        <div class="hud-block">
            <span class="hud-label">Wave</span>
            <strong id="wave-value">1</strong>
        </div>
        <div class="hud-block">
            <span class="hud-label">Lives</span>
            <strong id="lives-value">3</strong>
        </div>
        <div class="hud-block">
            <span class="hud-label">Shield</span>
            <strong id="shield-value">0</strong>
        </div>
        <div class="hud-block hud-block--grow" aria-live="polite">
            <span class="hud-label">Power</span>
            <span id="powerup-readout" class="powerup-readout">None</span>
        </div>
        <div class="hud-block hud-block--controls" role="group" aria-label="Game controls">
            <label class="hud-label" for="difficulty-select">Difficulty</label>
            <select id="difficulty-select" name="difficulty">
                <option value="relaxed">Relaxed</option>
                <option value="standard" selected>Standard</option>
                <option value="intense">Intense</option>
            </select>
            <button id="start-game" type="button" class="hud-button">Start</button>
            <button id="pause-game" type="button" class="hud-button" disabled aria-pressed="false">Pause</button>
        </div>
    </header>

    <div id="status-message" class="status-log" role="status" aria-live="polite">
        Tilt shields and clear the waves. Tap the on-screen pads or use your keyboard.
    </div>

    <div class="touch-panel" aria-label="Touch controls">
        <div class="touch-pad">
            <button class="touch-btn" data-dir="left" aria-label="Move left">◀</button>
            <button class="touch-btn" data-dir="right" aria-label="Move right">▶</button>
        </div>
        <div class="touch-actions">
            <button class="touch-btn touch-btn--fire" data-action="fire" aria-label="Fire">●</button>
            <button class="touch-btn touch-btn--utility" id="mobile-pause" aria-label="Pause or resume">II</button>
        </div>
    </div>

    <footer class="hud hud-bottom" role="presentation">
        <div class="hint">Keyboard: Arrow / A D to move, Space to fire, P to pause.</div>
        <div class="hint">Mobile: Hold the pads to strafe and tap fire. Grab power cores for rapid, spread, and shields.</div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
